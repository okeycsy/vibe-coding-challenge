server:
  # 클라우드 호스팅(Render 등)은 PORT 환경변수로 포트를 정해 준다
  port: ${PORT:8080}

spring:
  application:
    name: fee-calc-backend
  datasource:
    # 시연용 인메모리 DB. 서버를 재기동하면 DataInitializer가 예시 데이터를 다시 적재한다.
    url: jdbc:h2:mem:feecalc;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  h2:
    console:
      # 공개 서버(Docker 이미지)에서는 H2_CONSOLE_ENABLED=false 로 끈다. DB 콘솔이 인터넷에 열리면 안 된다.
      enabled: ${H2_CONSOLE_ENABLED:true}
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jackson:
    time-zone: Asia/Seoul

app:
  cors:
    # React(Vite) 개발 서버 + Vercel 공개 주소. 쉼표로 구분한 CORS_ALLOWED_ORIGINS 환경변수로 바꿀 수 있다.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,https://vibe-coding-challenge-nine.vercel.app}
  auth:
    max-fail-count: 5
  skills:
    # 업무별 skill.md 저장 폴더(1업무 1파일). 없는 파일은 기동 시 resources/skills 의 초기 기준을 복사해 만든다.
    # Render 무료 플랜처럼 디스크가 유지되지 않는 곳에서는 재배포·재기동 시 초기 기준으로 돌아간다.
    dir: ${SKILLS_DIR:./data/skills}
  mattermost:
    # 비어 있으면 실제 발송 없이 로그만 남긴다. 예: export MATTERMOST_WEBHOOK_URL=https://mattermost.example.com/hooks/xxx
    webhook-url: ${MATTERMOST_WEBHOOK_URL:}
    channel: fee-calc-alert

ai:
  # 회비 산출 AI(LLM) 설정. OpenAI Chat Completions 호환 API(OpenAI, Gemini OpenAI 호환 주소 등)를 RestClient 로 호출한다.
  # 공개 저장소이므로 키는 절대 이 파일에 적지 않는다. Render 등 호스팅의 환경변수 AI_API_KEY 로만 넣는다.
  # 이름을 달리 넣은 경우도 받는다: AI_API_KEY → OPENAI_API_KEY → GEMINI_API_KEY → GOOGLE_API_KEY 순서로 처음 값이 있는 것.
  # 키가 비어 있으면 AI 를 부르지 않고 규칙 기반(Rule-based) 보정·수식 생성으로 동작해 시연이 끊기지 않는다.
  api-key: ${AI_API_KEY:${OPENAI_API_KEY:${GEMINI_API_KEY:${GOOGLE_API_KEY:}}}}
  # 비워 두면 키 모양으로 정한다: Gemini 키(AIza...)면 Gemini OpenAI 호환 주소·gemini-2.5-flash, 아니면 OpenAI·gpt-4o-mini
  model: ${AI_MODEL:}
  # Gemini 예: https://generativelanguage.googleapis.com/v1beta/openai
  base-url: ${AI_BASE_URL:}
  timeout-seconds: ${AI_TIMEOUT_SECONDS:30}

logging:
  level:
    com.kftc.feecalc: DEBUG
