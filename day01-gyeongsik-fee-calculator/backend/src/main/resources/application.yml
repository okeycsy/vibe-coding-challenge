server:
  # 클라우드 호스팅(Render 등)은 PORT 환경변수로 포트를 정해 준다
  port: ${PORT:8080}

spring:
  application:
    name: fee-calc-backend
  datasource:
    # 시연용 인메모리 DB. 서버를 재기동하면 DataInitializer가 예시 데이터를 다시 적재한다.
    url: jdbc:h2:mem:feecalc;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  h2:
    console:
      # 공개 서버(Docker 이미지)에서는 H2_CONSOLE_ENABLED=false 로 끈다. DB 콘솔이 인터넷에 열리면 안 된다.
      enabled: ${H2_CONSOLE_ENABLED:true}
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jackson:
    time-zone: Asia/Seoul

app:
  cors:
    # React(Vite) 개발 서버 + Vercel 공개 주소. 쉼표로 구분한 CORS_ALLOWED_ORIGINS 환경변수로 바꿀 수 있다.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,https://vibe-coding-challenge-nine.vercel.app}
  auth:
    max-fail-count: 5
  skills:
    # 화면에서 수정한 skill.md 를 저장할 폴더. 비워 두면 메모리에만 반영되고 서버 재기동 시 원본(resources/skills)으로 돌아간다.
    dir: ${SKILLS_DIR:}
  mattermost:
    # 비어 있으면 실제 발송 없이 로그만 남긴다. 예: export MATTERMOST_WEBHOOK_URL=https://mattermost.example.com/hooks/xxx
    webhook-url: ${MATTERMOST_WEBHOOK_URL:}
    channel: fee-calc-alert

logging:
  level:
    com.kftc.feecalc: DEBUG
