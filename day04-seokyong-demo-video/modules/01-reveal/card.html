<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>01-reveal</title>
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
  body { font-family: 'Pretendard', 'Noto Sans KR', sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
  .bg { position: absolute; inset: 0; background: radial-gradient(1400px 700px at 50% 35%, #0f1b3d 0%, #070c1d 45%, #000 100%); }
  .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  @keyframes up { to { opacity: 1; transform: none; } }
  @keyframes fade { to { opacity: 1; } }
  @keyframes pop { 0% { opacity: 0; transform: scale(.86); } 60% { opacity: 1; transform: scale(1.03); } 100% { opacity: 1; transform: scale(1); } }
  @keyframes glow { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
  .logo { width: 250px; height: 250px; position: relative; opacity: 0; animation: pop 1100ms cubic-bezier(.2,.8,.2,1) forwards; }
  .logo img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 0 28px rgba(23,140,220,.65)); position: relative; }
  .logo::before { content: ''; position: absolute; inset: -30%; border-radius: 50%; background: radial-gradient(circle, rgba(23,140,220,.55), rgba(14,69,170,.25) 45%, transparent 70%); filter: blur(22px); animation: glow 4s ease-in-out infinite; }
  .title { font-size: 112px; font-weight: 900; letter-spacing: -0.035em; margin-top: 54px; opacity: 0; transform: translateY(26px); animation: up 900ms cubic-bezier(.2,.8,.2,1) forwards; }
  .slogan { font-size: 46px; font-weight: 500; color: #9fb0d6; margin-top: 26px; opacity: 0; transform: translateY(26px); animation: up 900ms cubic-bezier(.2,.8,.2,1) forwards; letter-spacing: -0.01em; }
  .accent { width: 120px; height: 6px; background: linear-gradient(90deg, #178cdc, #6ea8ff); border-radius: 3px; margin-top: 40px; opacity: 0; animation: fade 700ms forwards; }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="center">
    <div class="logo" style="animation-delay:.3s"><img src="LOGO_SRC" alt=""></div>
    <div class="title" style="animation-delay:1.6s">회비자동산출시스템</div>
    <div class="slogan" style="animation-delay:3.2s">규칙을 쓰면, 회비가 계산됩니다.</div>
    <div class="accent" style="animation-delay:4.2s"></div>
  </div>
</body>
</html>
